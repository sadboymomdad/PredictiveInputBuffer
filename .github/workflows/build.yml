
name: Build Geode Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.11.2
          target: Win64
          use-lto: false
          use-cpm-cache: false

      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveInputBuffer
          path: build/cesar.input-buffer.geode
          if-no-files-found: error
          retention-days: 14
